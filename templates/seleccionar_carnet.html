{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h1 class="h4 mb-0">
                        <i class="fas fa-id-card"></i> Generar Carnet
                    </h1>
                </div>
                <div class="card-body">
                    {% if error %}
                        <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="alumno" class="form-label">Seleccionar Alumno</label>
                            <select class="form-select" name="alumno" id="alumno" required>
                                <option value="">-- Seleccionar --</option>
                                {% for a in alumnos %}
                                    <option value="{{ a.id }}">{{ a.nombre }} {{ a.apellido }} (DNI: {{ a.dni }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-id-card"></i> Generar Carnet
                            </button>
                            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                        </div>
                    </form>
                    {% if not alumnos %}
                    <div class="alert alert-warning mt-3">
                        <i class="fas fa-exclamation-triangle"></i> No hay alumnos disponibles para generar carnets.
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
